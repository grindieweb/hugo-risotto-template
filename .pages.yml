media:
  - name: images
    label: Images
    input: static/images
    output: /images
    extensions: [png, jpg, jpeg, gif, svg, webp]
  - name: static
    label: Static files (favicons, etc.)
    input: static
    output: /
    extensions: [ico, png, svg, jpg, jpeg, webp, pdf]

content:
  # ---------------------------------------------------------------
  # Posts: content/posts/*.md
  # ---------------------------------------------------------------
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    filename: "{primary}.md"
    format: toml-frontmatter
    exclude: ["_index.md"]
    view:
      fields: [title, date, draft, tags]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssXXX
        default: now
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: description
        label: Description
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: categories
        label: Categories
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text

  # ---------------------------------------------------------------
  # About page: content/about.md
  # ---------------------------------------------------------------
  - name: about
    label: About page
    type: file
    path: content/about.md
    format: toml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssXXX
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text

  # ---------------------------------------------------------------
  # Homepage: content/_index.md (no front matter, plain markdown)
  # ---------------------------------------------------------------
  - name: home
    label: Homepage
    type: file
    path: content/_index.md
    format: raw
